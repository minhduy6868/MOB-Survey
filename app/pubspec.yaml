name: trovey
description: Offline field interviews about worldwide trading habits.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.6.0
  uuid: ^4.6.0
  google_fonts: ^6.3.2
  connectivity_plus: ^7.3.1
  image_picker: ^1.2.1
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/mark.png
